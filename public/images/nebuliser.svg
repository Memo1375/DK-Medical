  <rect x="140" y="100" width="180" height="130" rx="18" fill="#FFFFFF" stroke="#0178A2" stroke-width="4"/>
  <rect x="160" y="120" width="80" height="30" rx="6" fill="#0178A2"/>
  <text x="200" y="140" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEBULISER</text>
  <circle cx="280" cy="135" r="14" fill="#4EC2B5"/>
  <path d="M 280 128 L 280 142" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Air vents -->
  <line x1="240" y1="175" x2="300" y2="175" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="185" x2="300" y2="185" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="195" x2="300" y2="195" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <!-- Tubing and Mask -->
