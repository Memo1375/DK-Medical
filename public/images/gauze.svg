<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Sterile Gauze Swabs & Pads -->
  <g transform="translate(100, 70)">
    <rect x="20" y="20" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <rect x="10" y="10" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#0178A2" stroke-width="3"/>
    <!-- Gauze weave pattern -->
    <path d="M 0 30 L 120 30 M 0 60 L 120 60 M 0 90 L 120 90 M 30 0 L 30 120 M 60 0 L 60 120 M 90 0 L 90 120" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="60" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0178A2" text-anchor="middle">STERILE GAUZE 8-PLY</text>
  </g>
</svg>
