<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Bag Handle -->
  <path d="M 150 90 C 150 60 250 60 250 90" fill="none" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
  <!-- First Aid Bag (Red) -->
  <rect x="90" y="85" width="220" height="160" rx="20" fill="#E3111D" stroke="#B90C16" stroke-width="4"/>
  <!-- Zipper Line -->
  <path d="M 90 115 L 310 115" stroke="#1E293B" stroke-width="4"/>
  <!-- White Cross -->
  <rect x="185" y="140" width="30" height="70" rx="4" fill="#FFFFFF"/>
  <rect x="165" y="160" width="70" height="30" rx="4" fill="#FFFFFF"/>
  <!-- Tag -->
  <text x="200" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FIRST AID</text>
</svg>
