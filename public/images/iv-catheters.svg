<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- IV Cannula / Catheter (Pink 20G / Green 18G / Blue 22G) -->
  <g transform="translate(50, 80)">
    <!-- Needle -->
    <line x1="20" y1="70" x2="120" y2="70" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Catheter sheath -->
    <line x1="60" y1="70" x2="120" y2="70" stroke="#4EC2B5" stroke-width="6"/>
    <!-- Wings (Pink 20G) -->
    <polygon points="120,50 140,50 140,90 120,90" fill="#F472B6"/>
    <ellipse cx="130" cy="40" rx="14" ry="10" fill="#F472B6"/>
    <ellipse cx="130" cy="100" rx="14" ry="10" fill="#F472B6"/>
    <!-- Port / Cap -->
    <rect x="140" y="55" width="40" height="30" rx="4" fill="#F472B6" stroke="#DB2777" stroke-width="2"/>
    <circle cx="160" cy="45" r="8" fill="#F472B6"/>
    <!-- Flashback chamber -->
    <rect x="180" y="60" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#0178A2" stroke-width="2"/>
    <!-- Blood flash red indicator -->
    <rect x="182" y="63" width="30" height="14" rx="2" fill="#E3111D"/>
    <!-- Luer plug -->
    <rect x="260" y="57" width="20" height="26" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0178A2" text-anchor="middle">PERIPHERAL IV CATHETERS</text>
</svg>
