<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Fingertip Pulse Oximeter -->
  <rect x="120" y="80" width="160" height="140" rx="24" fill="#0178A2" stroke="#015B7A" stroke-width="3"/>
  <rect x="135" y="95" width="130" height="85" rx="12" fill="#0F172A"/>
  <!-- Screen values -->
  <text x="175" y="140" font-family="monospace" font-size="34" font-weight="bold" fill="#4EC2B5" text-anchor="middle">98</text>
  <text x="175" y="158" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">%SpO2</text>
  <text x="235" y="140" font-family="monospace" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">75</text>
  <text x="235" y="158" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">PR bpm</text>
  <!-- Mini pulse bar -->
  <path d="M 145 168 L 155 168 L 160 160 L 165 172 L 170 168 L 255 168" stroke="#E3111D" stroke-width="2" fill="none"/>
  <!-- Power button -->
  <circle cx="200" cy="198" r="10" fill="#4EC2B5"/>
  <circle cx="200" cy="198" r="4" fill="#FFFFFF"/>
</svg>
